<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>godamn.beauty</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700;800&display=swap');

    :root {
      --rose: #f5c3d5;
      --rose-deep: #e59db7;
      --rose-shadow: #c57795;
      --cream: #fef8f2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100vh;
      overflow: hidden;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 300;
      background: radial-gradient(
        circle at center,
        #ffffff 0%,
        #ffe7ef 10%,
        #f7cfe0 30%,
        #f0aeca 60%,
        #e58cb3 85%,
        #d86f9c 100%
      );
      color: var(--cream);
      display: flex;
      justify-content: center;
    }

    .page {
      width: min(1200px, 100%);
      padding: 32px clamp(16px, 5vw, 48px);
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px clamp(16px, 4vw, 40px);
      text-transform: lowercase;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 300;
      letter-spacing: 0.08em;
      font-size: 1.05rem;
      margin-bottom: clamp(24px, 4vw, 36px);
      position: relative;
      z-index: 100;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      box-shadow: 0 3px 10px rgba(197, 87, 128, 0.08);
      transform: translateX(-1px);
    }

    header::after {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: inherit;
      background: linear-gradient(120deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.005));
      pointer-events: none;
      z-index: -1;
    }

    .brand {
      font-weight: 300;
      color: white;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    nav {
      display: flex;
      gap: clamp(18px, 5vw, 40px);
      font-size: 1.05rem;
      font-weight: 300;
      letter-spacing: 0.06em;
    }

    nav a {
      color: var(--cream);
      text-decoration: none;
      opacity: 0.95;
    }

    .search {
      width: 36px;
      height: 36px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 0.9rem;
    }
 
    .hero {
      position: relative;
      height: calc(100vh - 140px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      background: transparent;
    }

    .hero-image {
      position: relative;
      width: 80%;
      max-width: 960px;
      filter: drop-shadow(0 40px 70px rgba(111, 35, 70, 0.35));
    }

    .hero-image img {
      width: 100%;
      display: block;
      border-radius: clamp(24px, 5vw, 48px);
      -webkit-mask-image: radial-gradient(circle at 50% 35%, rgba(0, 0, 0, 0.95) 65%, transparent 100%);
      mask-image: radial-gradient(circle at 50% 35%, rgba(0, 0, 0, 0.95) 65%, transparent 100%);
    }

    .big-type {
      font-family: "Metamorphous", "Playfair", serif;
      font-size: clamp(9rem, 24vw, 9rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.95);
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%) perspective(500px) rotateX(5deg);
      width: 90%;
      max-width: 1200px;
      text-align: center;
      pointer-events: none;
      font-weight: 300;
      text-shadow: 
        1px 1px 0 rgba(0, 0, 0, 0.15),
        2px 2px 2px rgba(0, 0, 0, 0.1),
        4px 4px 3px rgba(0, 0, 0, 0.1),
        0 10px 15px rgba(176, 69, 120, 0.2);
      z-index: 1000;
      margin: 0;
      padding: 0;
      line-height: 1;
      transform-style: preserve-3d;
      transition: transform 0.3s ease;
    }

    .logo-text-container {
      position: fixed;
      left: 5%;
      top: 40%;
      transform: translateY(-50%);
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: 280px;
    }
    
    .product-text {
      color: white;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 500;
      text-align: left;
      margin-top: 15px;
      line-height: 1.8;
      letter-spacing: 0.1px;
      text-transform: uppercase;
      font-size: 1.1rem;
      max-width: 320px;
      white-space: normal;
    }
    
    .typing-text {
      display: inline-block;
      white-space: nowrap;
      overflow: hidden;
      border-right: 2px solid white;
      font-weight: 800;
      font-size: 1.5rem;
      letter-spacing: 0.7px;
      margin-bottom: 10px;
      animation: 
        typing 3s steps(30, end) forwards,
        blink-caret 0.75s step-end 3;
    }
    
    @keyframes typing {
      from { width: 0 }
      to { width: 100% }
    }
    
    @keyframes blink-caret {
      from, to { border-color: transparent }
      50% { border-color: white; }
    }

    @keyframes logoPulse {
      0%, 100% { 
        transform: scale(1);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      }
      50% { 
        transform: scale(1.08);
        box-shadow: 0 6px 30px rgba(0, 0, 0, 0.25);
      }
    }

    .rest-of-text {
      font-weight: 530;
      opacity: 0.9;
      line-height: 1.6;
      margin-top: 10px;
      text-rendering: geometricPrecision;
    }

    .logo-container {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      margin-bottom: 25px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: logoPulse 3s ease-in-out infinite;
    }

    .logo-container:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.2);
    }

    .logo-container img {
      width: 70%;
      height: auto;
      object-fit: contain;
    }

    /* Tablet and below */
    @media (max-width: 1024px) {
      .logo-text-container {
        width: 240px;
        left: 3%;
      }
      
      .typing-text {
        font-size: 1.1rem;
      }
      
      .product-text {
        font-size: 0.95rem;
        max-width: 280px;
      }
      
      .brand {
        font-size: 1.2rem;
      }
      
      nav {
        gap: 20px;
      }

      .big-type {
        font-size: clamp(4rem, 20vw, 6rem);
      }
    }

    /* Mobile Styles */
    @media (max-width: 768px) {
      html, body {
        height: 100vh;
        overflow: hidden;
      }

      body {
        display: block;
      }

      .page {
        padding: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Header at top */
      header {
        flex-direction: column;
        gap: 8px;
        padding: 12px 16px;
        margin: 12px 12px 0 12px;
        border-radius: 20px;
        flex-shrink: 0;
        z-index: 200;
        order: -2;
      }

      .brand {
        font-size: 1rem;
        letter-spacing: 0.14em;
      }

      nav {
        gap: 14px;
        font-size: 0.85rem;
        flex-wrap: wrap;
        justify-content: center;
      }

      .search {
        position: absolute;
        top: 12px;
        right: 16px;
        width: 28px;
        height: 28px;
        font-size: 0.8rem;
      }

      /* Logo and text - positioned at top */
      .logo-text-container {
        position: fixed;
        top: 110px;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        padding: 0 20px;
        margin: 0;
        align-items: center;
        text-align: center;
        z-index: 10;
        pointer-events: none;
      }

      .logo-container {
        width: 55px;
        height: 55px;
        margin-bottom: 10px;
        animation: logoPulse 3s ease-in-out infinite;
      }

      .product-text {
        text-align: center;
        font-size: 0.75rem;
        max-width: 100%;
        margin-top: 6px;
        line-height: 1.6;
      }

      .typing-text {
        font-size: 0.8rem;
        font-weight: 800;
        animation: 
          typing 2s steps(30, end) forwards,
          blink-caret 0.75s step-end 3;
      }

      .rest-of-text {
        text-align: center;
        font-size: 0.7rem;
        line-height: 1.5;
        margin-top: 6px;
      }

      /* Hero section - positioned at absolute bottom */
      .hero {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        height: auto;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        z-index: 5;
      }

      .hero-image {
        width: 100%;
        max-width: 520px;
        filter: drop-shadow(0 20px 40px rgba(111, 35, 70, 0.3));
        margin-bottom: 0;
      }

      .hero-image img {
        border-radius: 20px;
        -webkit-mask-image: radial-gradient(circle at 50% 40%, rgba(0, 0, 0, 0.98) 70%, transparent 100%);
        mask-image: radial-gradient(circle at 50% 40%, rgba(0, 0, 0, 0.98) 70%, transparent 100%);
      }

      /* Big type at bottom middle - OVER the image */
      .big-type {
        font-size: 2.4rem;
        bottom: 50px;
        left: 50%;
        transform: translateX(-50%);
        letter-spacing: 0.14em;
        z-index: 20;
      }
    }

    /* Small Mobile */
    @media (max-width: 480px) {
      .brand {
        font-size: 0.85rem;
        letter-spacing: 0.12em;
      }

      nav {
        gap: 10px;
        font-size: 0.75rem;
      }

      .logo-container {
        width: 50px;
        height: 50px;
      }

      .typing-text {

        margin-top: 10px;
        margin-bottom: 5px;
        font-size: 1.1rem;
      }

      .product-text,
      .rest-of-text {
        margin: 0;
        line-height: 20px;
        font-size: 0.75rem;
        font-weight: 400;
      }

      .big-type {
        font-size: 1.9rem;
        letter-spacing: 0.1em;
      }
    }

    @media (max-width: 375px) {
      .brand {
        font-size: 0.8rem;
      }

      nav {
        font-size: 0.7rem;
        gap: 8px;
      }

      .big-type {
        font-size: 1.7rem;
      }

      .typing-text {
        font-size: 0.65rem;
      }

      .product-text,
      .rest-of-text {
        font-size: 0.6rem;
      }
    }
  </style>
</head>
<body>
  <div class="logo-text-container">
    <div class="logo-container">
      <img src="images/logo.png" alt="Logo">
    </div>
    <div class="product-text">
      <span class="typing-text">IT'S ALMOST READY TO GO . . .</span>
      <div class="rest-of-text">no more waiting around.<br>Go Damn coming soon –<br>keep watching, you won't regret it.</div>
    </div>
  </div>

  <div class="page">
    <header>
      <div class="brand">GODAMN.BEAUTY</div>
      <nav>
        <a href="https://www.instagram.com/godamn.beauty/">Instagram</a>
        <a href="#">Contact</a>
        <a href="#">Policy</a>
      </nav>
      <div class="search">◦</div>
    </header>

    <div class="hero">
      <div class="hero-image">
        <img src="images/lady.png" alt="Model applying lip gloss" />
      </div>
    </div>
  </div>
  
  <div class="big-type">GODAMN</div>
</body>
</html>
