<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us - godamn.beauty</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700;800&display=swap');

    :root {
      --rose: #f5c3d5;
      --rose-deep: #e59db7;
      --rose-shadow: #c57795;
      --cream: #fef8f2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100vh;
      overflow-x: hidden;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 300;
      background: radial-gradient(
        circle at center,
        #ffffff 0%,
        #ffe7ef 10%,
        #f7cfe0 30%,
        #f0aeca 60%,
        #e58cb3 85%,
        #d86f9c 100%
      );
      color: var(--cream);
      line-height: 1.6;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    .back-link {
      display: inline-block;
      color: var(--cream);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 20px;
      opacity: 0.8;
      transition: opacity 0.3s ease;
    }

    .back-link:hover {
      opacity: 1;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 20px;
    }

    .content {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-bottom: 40px;
    }

    .contact-info h2 {
      font-size: 1.5rem;
      font-weight: 500;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .contact-item {
      margin-bottom: 20px;
    }

    .contact-item h3 {
      font-size: 1.1rem;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--rose);
    }

    .contact-item p {
      font-weight: 300;
      opacity: 0.9;
    }

    .contact-form h2 {
      font-size: 1.5rem;
      font-weight: 500;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 400;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, textarea {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      color: var(--cream);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      font-weight: 300;
      transition: all 0.3s ease;
    }

    input::placeholder, textarea::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    input:focus, textarea:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--rose);
      box-shadow: 0 0 0 2px rgba(245, 195, 213, 0.2);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .submit-btn {
      background: var(--rose);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 25px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(197, 87, 128, 0.3);
    }

    .submit-btn:hover {
      background: var(--rose-deep);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(197, 87, 128, 0.4);
    }

    .social-links {
      text-align: center;
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .social-links h3 {
      font-size: 1.2rem;
      font-weight: 500;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .social-links a {
      color: var(--cream);
      text-decoration: none;
      font-size: 1.1rem;
      margin: 0 15px;
      opacity: 0.8;
      transition: opacity 0.3s ease;
    }

    .social-links a:hover {
      opacity: 1;
    }

    /* Mobile Styles */
    @media (max-width: 768px) {
      .container {
        padding: 20px 15px;
      }

      h1 {
        font-size: 2rem;
      }

      .content {
        padding: 25px;
      }

      .contact-grid {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      h2 {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="index.html" class="back-link">← Back to Home</a>
      <h1>Contact Us</h1>
    </header>

    <div class="content">
      <div class="contact-grid">
        <div class="contact-info">
          <h2>Get in Touch</h2>
          
          <div class="contact-item">
            <h3>Email</h3>
            <p>hello@godamn.beauty</p>
          </div>

          <div class="contact-item">
            <h3>Phone</h3>
            <p>1-800-GODAMN</p>
          </div>

          <div class="contact-item">
            <h3>Business Hours</h3>
            <p>Monday - Friday: 9AM - 6PM<br>
            Saturday: 10AM - 4PM<br>
            Sunday: Closed</p>
          </div>

          <div class="contact-item">
            <h3>Address</h3>
            <p>Go Damn Beauty<br>
            123 Beauty Street<br>
            Mumbai, India 400001</p>
          </div>
        </div>

        <div class="contact-form">
          <h2>Send us a Message</h2>
          <form>
            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" placeholder="Your Name" required>
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
              <label for="subject">Subject</label>
              <input type="text" id="subject" name="subject" placeholder="How can we help?">
            </div>

            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" name="message" placeholder="Tell us more about your inquiry..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">Send Message</button>
          </form>
        </div>
      </div>

      <div class="social-links">
        <h3>Follow Us</h3>
        <a href="https://www.instagram.com/godamn.beauty/">Instagram</a>
        <a href="#">Facebook</a>
        <a href="#">Twitter</a>
        <a href="#">TikTok</a>
      </div>
    </div>
  </div>
</body>
</html>
